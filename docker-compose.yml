# ThreatLens — full stack: PostgreSQL + FastAPI backend + nginx-served React frontend.
#
#   cp .env.example .env      # then fill in secrets / API keys
#   docker compose up -d --build
#   open http://localhost:8080
#
name: threatlens

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-threatlens}:${POSTGRES_PASSWORD:-threatlens_dev_password}@db:5432/${POSTGRES_DB:-threatlens}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-threatlens}
      POSTGRES_USER: ${POSTGRES_USER:-threatlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threatlens_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # localhost only — for psql / DB tools
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    image: threatlens/backend:4.0.0
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"     # direct API access (Swagger at /docs)

  frontend:
    build: ./frontend
    image: threatlens/frontend:4.0.0
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  # ── Attack lab (opt-in): docker compose --profile lab up -d --build ─────────
  # A deliberately weak server, a log shipper, and an attacker toolkit on an isolated network.
  victim:
    profiles: ["lab"]
    build: ./lab/victim
    image: threatlens/lab-victim:4.0.0
    hostname: victim
    restart: unless-stopped
    networks: [lab]
    volumes:
      - lablogs:/var/log/lab

  shipper:
    profiles: ["lab"]
    build: ./lab/shipper
    image: threatlens/lab-shipper:4.0.0
    restart: unless-stopped
    environment:
      THREATLENS_URL: http://backend:8000/api/v1/logs/webhook
      INGEST_API_KEY: ${INGEST_API_KEY:-}
    volumes:
      - lablogs:/var/log/lab
    depends_on:
      backend:
        condition: service_healthy

  attacker:
    profiles: ["lab"]
    build: ./lab/attacker
    image: threatlens/lab-attacker:4.0.0
    networks: [lab]
    depends_on: [victim]
    environment:
      TARGET: victim

networks:
  lab:
    internal: false   # attacker needs no internet, but apk/pip run at build time only

volumes:
  pgdata:
  lablogs:
