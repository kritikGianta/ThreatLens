user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/lab/nginx-error.log warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    access_log /var/log/lab/access.log combined;
    server_tokens off;

    server {
        listen 80 default_server;
        root /var/www/acme;
        index index.html;

        # Product API (static stand-in for a real backend; payloads still land in the access log)
        location /api/products {
            default_type application/json;
            return 200 '{"products":[{"id":1,"name":"Acme Rocket Skates","price":129.99}]}';
        }
        # File download endpoint (target of path-traversal attempts)
        location /download { return 400 "invalid file\n"; }
        # Upload endpoint (target of web-shell uploads)
        location /uploads/ {
            if ($request_method = POST) { return 201 "stored\n"; }
            return 404;
        }
        location / { try_files $uri $uri/ =404; }
    }
}
